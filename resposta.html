<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resposta - EquatinoLab</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen text-center">
    <h1 class="text-4xl font-bold text-green-600 mb-6">Resposta da IA</h1>
    
    <div id="answer-box" class="bg-white shadow-lg rounded-lg p-6 w-full max-w-lg border border-gray-300">
        <p id="answer-text" class="text-lg text-gray-800"></p>
    </div>
    
    <button onclick="window.location.href='entrada.html'" class="mt-6 bg-green-500 text-white px-6 py-2 rounded-lg text-lg font-semibold hover:bg-green-600">
        Voltar para Escolha
    </button>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const resposta = localStorage.getItem("openaiResponse");
            document.getElementById("answer-text").innerText = resposta || "Nenhuma resposta disponível.";
        });
    </script>
</body>
</html>
